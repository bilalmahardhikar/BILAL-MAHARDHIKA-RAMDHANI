@media (max-width:1024px){.tiles.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .tiles.cats{gap:10px}
  .dtabs{max-width:none;margin:-8px calc(-1 * var(--page-x)) 16px;padding:0 var(--page-x)}
  label.row{max-width:100%;min-width:0}
  label.row > select.pill{min-width:0;max-width:100%;flex:1 1 auto}
  .tile.cat{min-height:132px;padding:14px;gap:8px}
  .tile.cat .ti-ico{width:48px;height:48px}
  .tile.cat .ti-t{font-size:16px}
  .tile.cat small{font-size:12px}
  .xp-row{grid-template-columns:1fr 1fr;gap:8px}
}

/* ===== Lorong tepi: kotak pallet ===== */
.dn-lr{padding:3px 2px;margin:0;display:flex;flex-direction:column;gap:2px;min-width:0;align-self:end;border-radius:4px;z-index:1;text-align:left}
.dn-lr.bawah{flex-direction:column-reverse;align-self:start}
.dn-lr.dim{opacity:.32}
.dn-lr.rec,.dn-lr.cand{box-shadow:0 0 0 2px var(--brand-text)}
.dn-lrt{appearance:none;border:0;background:none;font:inherit;color:var(--ink);padding:0 2px;margin:0;text-align:left;font-size:9.5px;font-weight:800;white-space:nowrap;overflow:visible;line-height:1.2;border-radius:3px;position:relative;z-index:2;width:max-content;max-width:none}
button.dn-lrt{cursor:pointer}
button.dn-lrt:hover{background:var(--brand-soft)}
button.dn-lrt:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.dn-lrt small{font-weight:600;color:var(--muted)}
.dn-lb{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--rb,2),var(--h));gap:1px}
.dn-lb .dn-c{height:var(--h);font-size:8.5px;overflow:hidden}
.dn-lr.tight .dn-c{font-size:0}
.dn-mkb{display:flex;flex-direction:column;align-items:stretch;gap:3px;align-self:end;padding:3px 3px;z-index:1}
.dn-mkb .dn-mk{align-self:center}
.dn-mkb .dn-c{height:var(--h);font-size:8.5px;overflow:hidden}
.dn-mkb.dim{opacity:.32}
.dn-lw{display:flex;flex-direction:column;gap:1px;min-width:0}
.dn-lnr{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1px}
.dn-ln{display:block;height:9px;font-style:normal;font-size:7.5px;font-weight:700;line-height:9px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden}
.dn-mkb .dn-mkn.a{margin-bottom:-2px}
.dn-mkb .dn-mkn.b{margin-top:-2px}
.dn.ringkas .dn-lnr,.dn.ringkas .dn-mkn{display:none}
.dn.ringkas .dn-lrt{font-size:8px}
.dn.ringkas .dn-lb .dn-c,.dn.ringkas .dn-mkb .dn-c{font-size:0}
.dn-c.star{font-size:12px;color:var(--brand-text);background:var(--amber-bg)}
/* ===== Timbang selesai ===== */
.done-box{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--ok-bg);color:var(--ink);font-size:13.5px;line-height:1.45;margin:4px 0 10px}
.done-box svg{flex:none;color:var(--ok);margin-top:1px}
/* ===== Simpan pallet: rekomendasi ★ ===== */
.lay-rec2{display:grid;gap:2px;min-width:180px}
.lay-rec2 b{font-size:13.5px;color:var(--brand-text)}
.lay-rec2 small{font-size:11.5px;color:var(--muted);line-height:1.35;white-space:normal}
tr.row-on td{background:var(--brand-soft)}
.ly-note{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
/* ===== Pop up tumpukan: menu masuk / keluar ===== */
.ly-mn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;padding:3px 8px;border-radius:999px;width:max-content}
.ly-mn.in{background:var(--in-soft);color:var(--in)}
.ly-mn.out{background:var(--out-soft);color:var(--out)}
.ly-act small.neg{color:var(--out)}
/* ===== Stock opname gabungan ===== */
.op-grid{display:grid;gap:6px;margin:0 0 12px;max-height:340px;overflow:auto;padding-right:2px}
.op-h,.op-r{display:grid;grid-template-columns:minmax(60px,1fr) minmax(56px,.9fr) minmax(72px,1fr) 70px 70px;gap:6px;align-items:center;font-size:12.5px}
.op-h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--panel);padding-bottom:2px}
.op-r .pill{min-height:36px;padding:6px 8px}
/* ===== Rekap Bukti Penyerahan (FI/PPC/07) ===== */
.rs-sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:900px;box-shadow:var(--shadow-1)}
.rs-sheet table{width:100%;border-collapse:collapse;color:#111}
.rs-head td{border:2px solid #111;padding:8px 10px;vertical-align:middle;font-size:13px}
.rs-co{width:28%;font-weight:800;text-align:center}
.rs-t{text-align:center}.rs-t b{display:block;font-size:15px}.rs-t span{display:block;margin-top:2px;font-size:12.5px;text-decoration:underline}
.rs-no{width:26%;font-size:12px}.rs-no div+div{margin-top:4px;border-top:1px solid #111;padding-top:4px}
.rs-tbl{margin-top:-2px}
.rs-tbl th,.rs-tbl td{border:1.5px solid #111;padding:4px 8px;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;height:26px}
.rs-tbl th{text-align:center;font-weight:800;background:#fff}
.rs-tbl td:first-child{text-align:center;width:40px;font-weight:700}
.rs-tbl td.l{text-align:left}
.rs-tbl .muted{color:#666}
.rs-sign{margin-top:-2px}
.rs-sign th{border:2px solid #111;padding:6px;font-size:13px;width:33.3%}
.rs-sign td{border:2px solid #111;height:110px}
@media print{
  .rs-bar,.ph,.toolbar,.hint{display:none!important}
  .rs-sheet{border:0;box-shadow:none;padding:0;max-width:none}
}
/* pop up tumpukan: isi kartu tidak melebar */
.ly-t{min-width:0}
.ly-act{min-width:0}
.ly-act > *{min-width:0;max-width:100%}
.ly-act .pill{width:100%;min-width:0}
.ly-act .btn{white-space:normal;height:auto;min-height:40px;line-height:1.25;padding-top:8px;padding-bottom:8px}
.ly-mn{font-size:11px;letter-spacing:0;text-transform:none;white-space:normal;max-width:100%}
.rs-sheet .rs-sign tr:last-child td,.rs-sheet .rs-tbl tr:last-child td{border-bottom:2px solid #111}

/* ---------- Planning Bongkar Harian ---------- */
.pl-day{gap:6px;align-items:center}
.pl-day .icon-btn:first-child svg{transform:rotate(180deg)}
.pl-sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0 12px}

.pl-sum .pl-w b{color:var(--muted)}.pl-sum .pl-p b{color:var(--amber)}.pl-sum .pl-s b{color:var(--ok)}

@media (max-width:640px){.pl-sum{grid-template-columns:repeat(2,minmax(0,1fr))}.pl-sum>div:first-child{grid-column:1 / -1}}

/* ---------- Outbound: pilih line (checker) & ambil pallet (helper) ---------- */
.sw.dn-cand{background:var(--dn-p);box-shadow:inset 0 0 0 1.5px var(--brand-text)}
tr.row-rec td{background:color-mix(in srgb,var(--amber-bg) 55%,transparent)}
.rec-star{color:#C98A00}
.ly-lp{display:grid;gap:10px}
.ly-lp .sum{margin:0}
.ly-lp-go{align-items:flex-end;gap:10px;flex-wrap:wrap}
.ly-lp-go .lay-f{flex:1;min-width:160px}
.am-docs{flex-wrap:wrap;margin-bottom:10px;max-width:100%}
.am-docs .seg-b em{font-style:normal;display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:11.5px}
.am-card{margin-top:12px;padding:12px}
.am-card.done{opacity:.75}

.am-h h3{margin:0;font-size:18px}
.am-h span{color:var(--muted);font-size:13.5px}
.am-h span b{color:var(--ink)}
.am-grid{display:grid;gap:4px;overflow-x:auto}
.am-r{display:grid;grid-template-columns:92px repeat(4,minmax(78px,1fr));gap:4px;align-items:stretch}
.am-th span{font-size:11.5px;color:var(--muted);font-weight:700;text-align:center}
.am-rh{display:flex;flex-direction:column;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink)}
.am-rh small{font-weight:600;color:var(--muted);font-size:10.5px}
.am-c{position:relative;display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:46px;padding:4px 7px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:inherit;text-align:left;color:var(--ink);min-width:0}
.am-c b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-c small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-c.e{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 60%,transparent) 6px 7px);border-style:dashed}
.am-c.x{background:var(--sunk);opacity:.6}
button.am-c{cursor:pointer}
.am-c.cand{border-color:var(--brand-text);background:var(--brand-soft)}
.am-c.cand:hover:not(:disabled){box-shadow:0 0 0 2px var(--brand-text)}
.am-c.rec{border-width:2px;background:var(--amber-bg);border-color:#D59A1C}

.qa-tag::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}

.qa-tag.qa-bad{color:var(--warn)}
.am-qa{font-style:normal;font-size:10px;font-weight:800;line-height:1.2;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-c.qa-tahan{border-style:dashed;border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--panel))}
.am-c.qa-tahan .am-qa,.am-c.qa-tolak .am-qa{color:var(--warn)}
.am-c.qa-belum .am-qa{color:var(--amber)}
@media (max-width:640px){.am-k{display:none}.am-r{grid-template-columns:62px repeat(4,minmax(64px,1fr))}.am-c{min-height:44px;padding:4px 5px}.am-c b{font-size:11.5px}}

/* ---------- Planning: BONGKAR (biru) / Pending (putih) ---------- */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pl-blue:#12324A;--pl-blue-t:#8FD3F5}}
:root[data-theme="dark"]{--pl-blue:#12324A;--pl-blue-t:#8FD3F5}
tr.pl-bkr td{background:var(--pl-blue)}
tr.pl-bkr.pl-carry td{background:var(--pl-blue)}
.badge.pl-bk{background:#00B0F0;color:#00293A;font-weight:800;letter-spacing:.02em}
.pl-sum .pl-b b{color:var(--pl-blue-t)}
.pl-tbl th{text-align:center}
.pl-tbl tfoot td{font-weight:800}

/* ---------- Pindah lewat peta ---------- */
.pd-new{margin-bottom:12px}
.pd-new h2{margin:0 0 10px}
.pd-pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin-bottom:12px}
.pd-slot{appearance:none;display:flex;flex-direction:column;gap:2px;text-align:left;border:2px dashed var(--line-strong);border-radius:12px;background:var(--surface);padding:10px 14px;font:inherit;color:var(--ink);cursor:pointer;min-height:64px}
.pd-slot small{font-size:12px;color:var(--muted);font-weight:700}
.pd-slot b{font-size:18px}
.pd-slot span{font-size:12px;color:var(--muted)}
.pd-slot.on{border-style:solid;border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.pd-slot:disabled{opacity:.5;cursor:default}
.pd-slot:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pd-arw{align-self:center;color:var(--muted)}
.pd-fields{display:grid;grid-template-columns:minmax(0,1fr) 140px minmax(0,1.4fr);gap:10px}

.pd-map h5{margin:8px 0 6px;font-size:13px;color:var(--muted)}
.pd-step{margin-top:8px}
.am-c.to{border-style:dashed;border-color:var(--ok);background:transparent;align-items:center;text-align:center}
.am-c.to small{color:var(--ok)}
.am-c.to b{font-size:11px;color:var(--muted);font-weight:600}
.am-c.to:not(:disabled):hover{background:var(--ok-bg)}
.am-c.to:disabled{opacity:.45}
.pd-area{width:100%}

@media (max-width:640px){.pd-card{padding:12px}.pd-map{padding:6px}.pd-map .am-r,.am-card .am-r{grid-template-columns:48px repeat(4,minmax(0,1fr));gap:3px}.pd-map .am-rh,.am-card .am-rh{font-size:11px}.pd-map .am-c,.am-card .am-c{padding:3px 4px}.pd-map .am-th span,.am-card .am-th span{font-size:10px}}

/* ---------- Animasi keluar silo ---------- */
.sa-sheet{max-width:560px;width:100%}
.sa-sheet h2{margin:0 0 4px}
.sa-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:center;margin:12px 0}
.sa-svg{width:100%}
.sa-info{display:flex;flex-direction:column;gap:4px}

.sa-info .sa-out{color:var(--warn);font-weight:800;font-size:15px}
.sa-info small{color:var(--muted);font-variant-numeric:tabular-nums}

/* halaman form SPL */
.spl{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px calc(28px + env(safe-area-inset-bottom,0px));background:radial-gradient(1200px 520px at 50% -180px,color-mix(in srgb,var(--sja-brown) 14%,transparent),transparent 70%),var(--bg)}
.spl-card{position:relative;overflow:hidden;width:min(600px,100%);padding:26px 26px 22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-2);animation:riseIn .45s var(--ease-out) both}
.spl-card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--sja-brown) 0 33.4%,var(--sja-red) 33.4% 66.7%,var(--sja-green) 66.7%)}
.spl-head{display:flex;align-items:center;gap:14px;margin:4px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.spl-head .logo-mark{width:46px}
.spl-head h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.spl-head p{color:var(--muted);font-size:13.5px}
.spl .fld > span{font-weight:700;font-size:13.5px}
.spl-chips{display:flex;flex-wrap:wrap;gap:8px}
.spl-chip{position:relative;display:inline-flex}
.spl-chip input{position:absolute;opacity:0;width:1px;height:1px}
.spl-chip span{display:inline-flex;align-items:center;min-height:42px;padding:0 15px;border:1px solid var(--line-strong);border-radius:999px;background:var(--panel);font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;transition:background var(--dur),border-color var(--dur),color var(--dur)}
.spl-chip span:hover{border-color:var(--brand-text);background:var(--brand-soft)}
.spl-chip input:checked + span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.spl-chip input:focus-visible + span{outline:2.5px solid var(--focus);outline-offset:2px}
.spl-time{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.spl-calc{margin:-2px 0 14px;padding:10px 12px;border-radius:var(--r);background:var(--sunk);font-size:13px;color:var(--ink);line-height:1.5}
.spl-calc b{color:var(--brand-text)}
.spl .btn.wide{width:100%;min-height:48px;font-size:15px;justify-content:center}
.spl-done{display:grid;justify-items:center;gap:10px;text-align:center;padding:8px 0 4px}
.spl-done .ic{width:52px;height:52px}
.spl-done h2{font-size:21px;margin:0}
.spl-done p{color:var(--muted);line-height:1.6}
.spl-done p b{color:var(--ink)}
.spl-foot{margin-top:16px;font-size:12.5px;color:var(--muted);text-align:center}
.spl-close{display:block;margin:8px auto 0}
@media (max-width:760px){
  .spl{padding:12px 10px 24px}
  .spl-card{padding:22px 16px 18px}
  .spl-head h1{font-size:21px}
  .spl-chip span{min-height:44px}
  .mp-chart .chart{min-width:600px}
  .mp-link .row{width:100%}
  .mp-link .row .btn{flex:1}
}

tr.imp-bad td{background:var(--warn-bg)}
td.imp-err{white-space:normal;min-width:220px;max-width:340px;font-size:12.5px;line-height:1.35}

/* revisi 16 Okt: segel beda bisa diklik untuk keterangan + bukti */
button.warn-ic{border:0;padding:0;cursor:pointer}
button.warn-ic:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--out-strong) 25%,transparent)}
button.warn-ic:focus-visible,.seg-ok:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.seg-ok{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border-radius:50%;border:0;padding:0;background:var(--ok-bg);color:var(--ok);cursor:pointer;vertical-align:1px}
.seg-sheet{width:min(520px,100%)}
.seg-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg-cmp > div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.seg-cmp small{color:var(--muted);font-size:11.5px}.seg-cmp b{font-size:15px;font-variant-numeric:tabular-nums}
.seg-sheet textarea.pill{width:100%;min-height:76px;resize:vertical;padding:10px 12px;line-height:1.4}
.seg-sheet input[type=file].pill{padding:8px 10px;height:auto}
.seg-file{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px}.seg-file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-pv{display:block;max-width:100%;max-height:320px;margin:0 auto 10px;border-radius:10px;border:1px solid var(--line)}
/* revisi 16 Okt: pop up notifikasi QA (tidak menghalangi pekerjaan) */
.notif{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;width:min(380px,calc(100vw - 32px))}
.nt-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand-text);border-radius:var(--r-xl);box-shadow:var(--shadow-3);padding:14px 14px 12px;animation:dialogIn .28s var(--ease-out) both;max-height:min(70vh,560px);display:flex;flex-direction:column}
.nt-h{display:flex;align-items:center;gap:8px}.nt-h b{flex:1;font-size:15px}
.nt-ic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);flex:none}
.nt-d{margin:6px 0 8px;font-size:13px;color:var(--muted)}
.nt-b{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.nt-b ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.nt-b li{display:flex;align-items:baseline;gap:8px;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--sunk)}
.nt-b li span{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-b li em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.nt-g h4{margin:0 0 4px;font-size:12.5px;display:flex;align-items:center;gap:6px}.nt-g h4 small{font-weight:500;color:var(--muted)}
.nt-g h4::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.nt-ok h4{color:var(--ok)}.nt-amber h4{color:var(--amber)}.nt-bad h4{color:var(--warn)}
.nt-a{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
@media (max-width:640px){.notif{right:10px;left:10px;width:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ===== revisi 2 Nov: kolom wajib + tanda merah, kotak nama SPL, saran Planning Bongkar ===== */
.fld.req>span::after{content:" *";color:var(--warn);font-weight:800}
.fld.bad>span{color:var(--warn)}
.fld.bad>.pill,.fld.bad>.combo>.pill,.pill.bad,input.bad,select.bad{border-color:var(--warn)!important;background-color:var(--warn-bg);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 18%,transparent)}
.fld.bad .spl-chip span{border-color:var(--warn)}
.fld-err{display:flex;align-items:center;gap:6px;font-style:normal;font-size:12.5px;font-weight:700;color:var(--warn);line-height:1.35}
.fld-err::before{content:"!";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--warn);color:var(--warn-bg);font-size:11px;font-weight:900;flex:none}
.combo{position:relative;min-width:0}
.combo-list{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);max-height:min(300px,46vh);overflow:auto;overscroll-behavior:contain;margin:0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:0 12px 30px -8px rgba(0,0,0,.28)}
.combo-list li{display:flex;align-items:center;min-height:44px;padding:8px 12px;border-radius:calc(var(--r) - 3px);font-size:14px;line-height:1.3;cursor:pointer}
.combo-list li.on,.combo-list li[data-v]:hover{background:var(--brand-soft)}
.combo-list li.on{box-shadow:inset 3px 0 0 var(--brand)}
.combo-list mark{background:none;color:var(--brand-text);font-weight:800}
.combo-list .combo-none,.combo-list .combo-more{color:var(--muted);cursor:default;font-size:13px}
.pl-saran{display:grid;gap:2px;margin-top:6px;max-width:250px;white-space:normal;text-align:left}
.pl-saran b{justify-self:start;white-space:nowrap;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;letter-spacing:.01em}
.pl-tbl .pl-saran{min-width:150px}
.pl-saran.ok b{background:var(--ok-bg);color:var(--ok)}
.pl-saran.no b{background:var(--warn-bg);color:var(--warn)}
.pl-saran small{font-size:11.5px;color:var(--muted);line-height:1.35}
.pl-kurang{display:block;margin-top:4px;max-width:220px;font-size:11.5px;font-weight:700;color:var(--warn);white-space:normal}
.pl-saran-box{margin:-2px 0 12px}
.pl-saran-box:empty{display:none}
.pl-saran-box>.pl-saran{max-width:none;margin:0;padding:9px 11px;border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--surface)}
.pl-saran-box>.pl-saran b{font-size:12.5px}.pl-saran-box>.pl-saran small{font-size:12.5px}
.pl-saran-box>small{display:block;padding:9px 11px;border:1px dashed var(--line-strong);border-radius:var(--r);font-size:12.5px;color:var(--muted);line-height:1.45}
.pl-sum{grid-template-columns:repeat(6,minmax(0,1fr))}
.pl-sum .pl-pos b{color:var(--ok)}
.pl-capinfo{margin:-4px 0 12px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.pl-capinfo b{color:var(--ink)}
@media (max-width:1100px){.pl-sum{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.pl-sum{grid-template-columns:repeat(2,minmax(0,1fr))}.pl-sum>div.pl-pos{grid-column:1 / -1}}

/* ===== revisi 2 Nov (2): kotak cari Update Layout, warna kode ke-2 di denah ===== */
.ly-search{position:sticky;top:calc(var(--tb-h, 64px) + 6px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 8px 20px -16px rgba(0,0,0,.35)}
.ly-sbox{position:relative;flex:1 1 320px;min-width:0;display:flex;align-items:center}
.ly-sbox .ic{position:absolute;left:12px;color:var(--muted);pointer-events:none}
.ly-sbox .pill{padding-left:40px;font-size:15px}
.ly-shit{font-size:12.5px;color:var(--muted)}
:root{--dn-k2p:#A9D2FA;--dn-k2pt:#0B2E55;--dn-k2f:#1F5FAD;--dn-k2ft:#F2F7FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dn-k2p:#5B91DA;--dn-k2pt:#04142A;--dn-k2f:#2E6CC2;--dn-k2ft:#F2F7FF}}
:root[data-theme="dark"]{--dn-k2p:#5B91DA;--dn-k2pt:#04142A;--dn-k2f:#2E6CC2;--dn-k2ft:#F2F7FF}
.dn-c.p.k2{background:var(--dn-k2p);color:var(--dn-k2pt)}
.dn-c.f.k2{background:var(--dn-k2f);color:var(--dn-k2ft)}
.dn-c.p.k2.kmix{background:linear-gradient(135deg,var(--dn-p) 0 50%,var(--dn-k2p) 50% 100%);color:var(--dn-pt)}
.dn-c.f.k2.kmix{background:linear-gradient(135deg,var(--dn-f) 0 50%,var(--dn-k2f) 50% 100%);color:var(--dn-fft)}
.dn-col.mix .dn-cs,.dn-lane.mix .dn-ls,.dn-lr.mix .dn-lb{outline:2px dashed var(--dn-k2f);outline-offset:1px;border-radius:3px}
.dn-kd em.k2,.dn-lkd em.k2,.ly-k em.k2{font-style:normal;color:var(--dn-k2f);font-weight:800}
.dn-col.mix .dn-kd{color:var(--ink)}
.sw.dn-k2p{background:var(--dn-k2p);outline:1.5px dashed var(--dn-k2f);outline-offset:1px}.sw.dn-k2f{background:var(--dn-k2f);outline:1.5px dashed var(--dn-k2f);outline-offset:1px}
.dn-lg2{display:inline-flex;align-items:center;gap:6px}

.bb-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.work > .side fieldset > .bb-2{grid-column:1 / -1}

/* ===== revisi 3 Nov ===== */
.dn-mkb.bawah{align-self:start}
.to-sec{margin-bottom:10px}.to-h{justify-content:space-between;margin-bottom:8px;gap:8px;flex-wrap:wrap}.to-f{margin:0 0 10px}

/* revisi 3 Nov (5): notifikasi QA di tengah layar, latar diburamkan */
.notif{position:fixed;inset:0;right:auto;bottom:auto;width:100%;height:100%;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(24,16,12,.38);-webkit-backdrop-filter:blur(6px) saturate(.9);backdrop-filter:blur(6px) saturate(.9);animation:ntFade .2s ease-out both}
.notif[hidden]{display:none}
.notif .nt-card{width:min(460px,100%);max-height:min(78vh,620px);border-left-width:5px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);padding:18px 18px 16px}
.notif .nt-h b{font-size:17px}.notif .nt-ic{width:34px;height:34px}.notif .nt-d{font-size:14px}
.notif .nt-b li{font-size:14px;padding:8px 10px}
.notif .nt-a{margin-top:14px}.notif .nt-a .btn{min-height:44px}
@keyframes ntFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.notif{animation:none}}
html.nt-open{overflow:hidden}
.notif .nt-a{flex-wrap:wrap}.nt-in h4{color:var(--brand-text)}.nt-out h4{color:var(--dn-k2f)}
/* revisi 5 Nov */
.kpi .occ-kg{display:block;margin-top:4px}.kpi .occ-kg b{display:inline;font-size:13px;margin:0;letter-spacing:0}
.am-c.pdw{opacity:1;background:var(--sunk);box-shadow:inset 0 0 0 2px var(--amber)}.am-c.pdw small+small{color:var(--amber);font-weight:700}
.pd-tw{color:var(--amber)}
.pd-hp{border-top:3px solid var(--amber)}
table.pd-cek td .btn{margin:0}
.lf-hit{font-size:14px}

/* revisi 5 Nov: kelola akun */
.sheet.wide{width:min(980px,100%);max-height:88vh;overflow:auto}
.ak-tabs{margin-bottom:12px}
.ak-edit{margin:0 0 12px;border-top:3px solid var(--brand)}
.ak-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
@media (max-width:640px){.ak-grid{grid-template-columns:1fr}.sheet.wide{max-height:92dvh}}
.sheet .tbl tr.on td{background:var(--brand-soft, var(--sunk))}
/* revisi 5 Nov: Monitoring Suhu F/WH/07 + Berita Acara */
.sh-card{padding:16px}
.sh-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-wrap{max-height:none}
table.sh-grid{border-collapse:collapse;min-width:760px;width:100%;font-size:12.5px}
table.sh-grid th,table.sh-grid td{border:1px solid var(--line-strong);padding:4px 5px;text-align:center;white-space:nowrap}
table.sh-grid tbody th{background:var(--sunk);text-align:left;font-weight:700;width:64px}
table.sh-grid tr.sh-tg th{background:var(--brand-soft);color:var(--brand-text);font-weight:800}
table.sh-grid tr.sh-tg th:first-child{color:var(--ink)}
table.sh-grid tr.sh-tg th:not(:first-child){text-align:center}
table.sh-grid tr.sh-jam td{color:var(--muted);font-size:11.5px}
table.sh-grid tr.sh-pic td{font-size:11px;color:var(--muted);max-width:70px;overflow:hidden;text-overflow:ellipsis}
table.sh-grid td.sh-hi{background:var(--amber-bg);color:var(--amber);font-weight:700}
table.sh-grid td.sh-ttd{vertical-align:top;text-align:left;padding:8px 10px;white-space:normal}
table.sh-grid td.sh-ttd span{display:block;height:44px}
table.sh-grid td.sh-ttd small{display:block;text-align:center;font-weight:700;color:var(--ink)}
.ba-form{padding:18px}
.ba-sec{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px 6px;margin:0 0 12px}
.ba-sec legend{font-weight:800;padding:0 6px;color:var(--brand-text)}
.ba-sec h4{margin:4px 0 6px;font-size:13px}
.ba-kat{margin-bottom:10px}
.ba-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
.ba-data{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
.ba-tb table td{padding:4px}.ba-tb table td:first-child{width:36px;text-align:center}.ba-tb .pill{min-height:38px}
@media (max-width:720px){.ba-3,.ba-data{grid-template-columns:1fr}}
.nt-ba h4{color:var(--amber)}

/* revisi 6 Nov */
th.qa-h{background:var(--brand-soft)!important;color:var(--brand-text)!important}
/* revisi 9 Nov: Data Keseluruhan lengkap, baris kelompok kolom */
.dk-tbl thead tr.dk-g th{background:var(--brand-soft)!important;color:var(--brand-text)!important;text-align:left;letter-spacing:.04em;font-size:11px;padding-top:7px;padding-bottom:7px;border-left:2px solid var(--line)}
.dk-tbl thead tr.dk-g th.dk-g2{background:var(--card)!important}
.dk-tbl td.wrap{white-space:normal;min-width:320px}
.dk-tbl thead tr.dk-g th{position:static!important;box-shadow:none!important}
td.qa-c{background:color-mix(in srgb, var(--brand-soft) 35%, transparent)}
.dn-note-tt{color:var(--amber);font-weight:700}
.pd-ck{border-top:3px solid var(--brand)}

/* ===== revisi 10 Nov: perbaikan UI/UX untuk tablet (helper) dan celah sistem ===== */
/* tarik layar ke bawah tidak lagi memuat ulang halaman (isian form tidak hilang) */
html,body{overscroll-behavior-y:contain}
/* peta ukuran Besar: kotak baris cukup besar untuk jari (bawaan di layar sentuh) */
.dn.besar{zoom:1.7}
.dn-help{margin:0 0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.dn-help > summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--brand-text);cursor:pointer;border-radius:var(--r)}
.dn-help > summary::-webkit-details-marker{display:none}
.dn-help > summary::before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);font-size:12px;font-weight:800;flex:none}
.dn-help > summary::after{content:"Tampilkan";margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.dn-help[open] > summary::after{content:"Sembunyikan"}
.dn-help > summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dn-help .dn-hint{margin:0;padding:2px 12px 12px}
.dn-swipe{display:none;margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
@media (pointer:coarse){.dn-swipe{display:block}}
/* tabel: bayangan di tepi = masih ada kolom di sebelahnya */
.tbl.sx-r{box-shadow:inset -22px 0 16px -16px rgba(40,22,12,.34)}
.tbl.sx-l{box-shadow:inset 22px 0 16px -16px rgba(40,22,12,.34)}
.tbl.sx-l.sx-r{box-shadow:inset -22px 0 16px -16px rgba(40,22,12,.34),inset 22px 0 16px -16px rgba(40,22,12,.34)}
/* tablet tegak: tabel setinggi layar dengan kepala kolom tetap terlihat, bukan halaman sepanjang ribuan baris */
@media (min-width:761px) and (max-width:1024px){
  .tbl{max-height:max(440px,calc(100vh - 150px));max-height:max(440px,calc(100dvh - 150px))}
  .tbl.flat{max-height:none}
}
/* kolom Aksi di ujung kanan tetap terlihat walau tabel digeser */
@media (max-width:1024px){
  .tbl table.act-r tbody td:last-child:not(:first-child),.tbl table.act-r thead th:last-child:not(:first-child){position:sticky;right:0;z-index:1;background:var(--panel);box-shadow:-1px 0 0 var(--line),-10px 0 12px -10px rgba(40,22,12,.22)}
  .tbl table.act-r thead th:last-child:not(:first-child){z-index:3;background:var(--surface)}
  .tbl table.act-r tbody td:last-child:not(:first-child) .btn{white-space:nowrap}
}
/* sasaran sentuh */
@media (pointer:coarse){
  .badge-btn{min-height:36px;padding-left:12px;padding-right:12px}
  .chip-b{min-height:40px}
  .seg-b{min-height:40px}
}
/* tombol kembali ke atas */
.totop{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:35;width:48px;height:48px;border-radius:50%;border:1px solid var(--line-strong);background:var(--panel);color:var(--brand-text);font:inherit;font-size:20px;font-weight:800;line-height:1;cursor:pointer;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity var(--dur),transform var(--dur)}
.totop.on{opacity:1;pointer-events:auto;transform:none}

/* ---------- Planning Bongkar Harian (form F/WH/14, diisi checker inbound pagi hari) ----------

const planDate = () => isYmd(S.ui.plDate) ? S.ui.plDate : today();

   Sisa posisi = posisi kosong di kolom (kolom yang tertutup pallet di lorong tidak dihitung) + kotak lorong tepi
   + Line U (kalau kapasitasnya sudah diisi di Master Data), dikurangi pallet yang sudah ditimbang tapi belum punya posisi
   dan sisa pallet truk BONGKAR yang belum selesai ditimbang. Truk Pending dicek urut kedatangan.

/* ---------- Denah gudang: mengikuti file "Visualisasi Layout Gudang Kopi" ----------
   Blok A sampai E berjejer kiri ke kanan. Kolom atas dan bawah saling berhadapan dipisah lorong tengah (ada pilar).
   Nomor baris dimulai dari bawah ke atas (baris 1 paling bawah), baik kolom atas maupun kolom bawah.
   Area godok blok A berisi jalur mendatar LA.19 (paling atas) sampai LA.09 (dekat lorong), 11 baris, baris 1 di ujung kanan.

const rangeIds = (pfx, a, b) => Array.from({ length:b - a + 1 }, (_, i) => `${pfx}.${pad(a + i)}`);

  { gap:'BC', n:1 },
  { blok:'C', atas:['EXC.02', ...rangeIds('LC', 18, 34)], bawah:['EXC.01', ...rangeIds('LC', 1, 17)] },
  { gap:'CD', n:1 },
  { blok:'D', atas:['EXD.02', ...rangeIds('LD', 16, 30)], bawah:['EXD.01', ...rangeIds('LD', 1, 15)] },
  { gap:'DE', n:1 },

    const w = d.bawah.length; d.bawah.forEach((l, i) => { col[l] = c + i; }); (d.atas || []).forEach((l, i) => { col[l] = c + i; });

const DN_BAWAH = [['LA.04','red'],['AB2','pintu','Pintu 6'],['LB.02','blue'],['LB.03','red'],['LB.12','pintu','Pintu 5'],['LC.02','red'],['LC.12','red'],['LC.17','pintu','Pintu 4'],['LD.04','red'],['LD.09','blue'],['LD.15','pintu','Pintu 3'],['LE.02','red']];
const DN_PILAR = ['LA.05','LB.02','LB.07','EXC.01','LC.08','LC.15','LD.01','LD.04','LD.08','LD.15','LE.06'];
/* ---------- Akses forklift (jalur hijau di file layout) ----------
   Line atas dimasuki dari jalur atas: baris paling atas (13) paling depan, baris 1 paling dalam.
   Line bawah dimasuki dari jalur bawah: baris 1 paling depan. LA.09-LA.19 dari jalur kanan: baris 1 paling depan.

/* ---------- Silo GSI (gambar silo dengan animasi isi per 100 ton) ---------- */
function siloSvg(id, small){
  const cap = siloCap(id), lv = Math.max(0, siloLevel(id)), fr = Math.max(0, Math.min(1, lv / cap));
  const top = 46, bot = 236, h = bot - top, yv = t => bot - (t * 1000 / cap) * h, fy = bot - fr * h;
  const marks = [100, 200, 300].map((t, i) => { const y = yv(t), hit = lv >= t * 1000;
    return `<g class="silo-mark${hit ? ' hit' : ''}" style="--d:${0.35 + i * 0.35}s"><line x1="44" x2="156" y1="${y}" y2="${y}"/><text x="164" y="${y + 4}">${t} t</text></g>`; }).join('');
  const uid2 = 'sc' + id + (small ? 's' : '');
  return `<svg class="silo-svg${small ? ' sm' : ''}" viewBox="0 0 210 300" role="img" aria-label="${esc(siloName(id))} terisi ${num(Math.round(lv / 100) / 10)} ton dari ${num(cap / 1000)} ton">
    <defs><clipPath id="${uid2}"><rect x="42" y="${top}" width="116" height="${h}" rx="4"/></clipPath>
    <linearGradient id="${uid2}g" x1="0" x2="1"><stop offset="0" stop-color="#C8902E"/><stop offset=".5" stop-color="#E9BE62"/><stop offset="1" stop-color="#C8902E"/></linearGradient></defs>
    <path class="silo-roof" d="M40 ${top} Q100 6 160 ${top} Z"/>
    <rect class="silo-body" x="40" y="${top}" width="120" height="${h}" rx="5"/>
    <g clip-path="url(#${uid2})"><g class="silo-grow"><rect class="silo-fill" x="40" y="${fy}" width="120" height="${bot - fy}" fill="url(#${uid2}g)"/><rect class="silo-fill-top" x="40" y="${fy}" width="120" height="3"/></g></g>
    <path class="silo-cone" d="M40 ${bot} L160 ${bot} L112 280 L88 280 Z"/>
    <line class="silo-leg" x1="52" y1="${bot}" x2="52" y2="294"/><line class="silo-leg" x1="148" y1="${bot}" x2="148" y2="294"/>
    ${marks}
    <text class="silo-val" x="100" y="${Math.min(bot - 12, Math.max(top + 30, fy + 26))}" text-anchor="middle">${num(Math.round(lv))} kg</text>
  </svg>`;
}
/* Animasi keluar silo ke produksi: isi silo turun pelan-pelan, butiran gandum mengalir dari corong */

  const marks = [100, 200, 300].map(t => { const y = bot - (t * 1000 / cap) * h; return `<g class="silo-mark"><line x1="44" x2="156" y1="${y}" y2="${y}"/><text x="164" y="${y + 4}">${t} t</text></g>`; }).join('');

    <linearGradient id="${u}g" x1="0" x2="1"><stop offset="0" stop-color="#C8902E"/><stop offset=".5" stop-color="#E9BE62"/><stop offset="1" stop-color="#C8902E"/></linearGradient></defs>
    <path class="silo-roof" d="M40 ${top} Q100 6 160 ${top} Z"/><rect class="silo-body" x="40" y="${top}" width="120" height="${h}" rx="5"/>
    <g clip-path="url(#${u}c)"><rect id="sa-fill" class="silo-fill" x="40" y="${fy}" width="120" height="${bot - fy}" fill="url(#${u}g)"/><rect id="sa-top" class="silo-fill-top" x="40" y="${fy}" width="120" height="3"/></g>
    <path class="silo-cone" d="M40 ${bot} L160 ${bot} L112 280 L88 280 Z"/><line class="silo-leg" x1="52" y1="${bot}" x2="52" y2="294"/><line class="silo-leg" x1="148" y1="${bot}" x2="148" y2="294"/>

function siloAnim(id, from, to, title, sub){
  const m = $('#modal'), cap = siloCap(id), top = 46, bot = 236, h = bot - top;
  m.innerHTML = `<div class="sheet sa-sheet" role="dialog" aria-modal="true" aria-labelledby="sa-t"><h2 id="sa-t">${esc(title)}</h2><p class="hint">${esc(sub)}</p>
    <div class="sa-wrap">${siloAnimSvg(id, from)}<div class="sa-info"><span>Isi ${esc(siloName(id))}</span><b id="sa-num">${num(from)} kg</b><span class="sa-out">−${num(from - to)} kg keluar ke produksi</span><small id="sa-pct">${num(Math.round(from / cap * 1000) / 10)}% terisi</small></div></div>
    <div class="actions"><button class="btn blue" data-act="modalNo">Tutup</button></div></div>`;
  m.hidden = false;
  const fill = m.querySelector('#sa-fill'), topR = m.querySelector('#sa-top'), nEl = m.querySelector('#sa-num'), pEl = m.querySelector('#sa-pct'), pour = m.querySelector('#sa-pour'), sheet = m.querySelector('.sa-sheet');
  const set = v => { const fy = bot - Math.max(0, Math.min(1, v / cap)) * h; fill.setAttribute('y', fy); fill.setAttribute('height', Math.max(0, bot - fy)); topR.setAttribute('y', fy); nEl.textContent = num(Math.round(v)) + ' kg'; pEl.textContent = num(Math.round(v / cap * 1000) / 10) + '% terisi'; };

    if (k < 1) requestAnimationFrame(step); else setTimeout(() => { pour.classList.remove('on'); sheet.classList.add('done'); }, 450); };
  requestAnimationFrame(step);
}

const DMY = /^(\d{2})\/(\d{2})\/(\d{4})(?: (\d{2}):(\d{2}))?$/;
const xSerial = m => (Date.UTC(+m[3], +m[2] - 1, +m[1]) - Date.UTC(1899, 11, 30)) / 864e5 + (m[4] ? (+m[4] * 60 + +m[5]) / 1440 : 0);
const xNumLen = (n, dec) => { const [a, b] = Math.abs(n).toFixed(dec ? 2 : 0).split('.'); return a.length + Math.floor((a.length - 1) / 3) + (b ? b.length + 1 : 0) + (n < 0 ? 1 : 0); };
const X_CENTER = /^(No|No\.|No Pallet|Pallet ke-|Jam|Kode.*|Line|Nama Line|Kolom|Baris|Blok|Sat|Satuan|Status.*|Arah|Hitung|Cek Segel|Asal|Sumber|Jenis)$/i;
const X_PLAIN = /^(No\b|Nomor\b|Pallet ke-|Baris|Kolom|Rev)/i;
const isSgn = v => !!v && typeof v === 'object' && v.sign;
const X_WEIGHT = /kg|berat|netto|brutto|bruto|tonase|rata|selisih|stok|susut|tara|%|°C/i;
function xCol(h, vals){
  const H = String(h ?? ''), nums = [], strs = [];
  for (const v of vals) { if (typeof v === 'number' && isFinite(v)) nums.push(v); else if (isSgn(v) && isFinite(v.n)) nums.push(v.n); else if (typeof v === 'string' && v !== '') strs.push(v); }
  const plain = X_PLAIN.test(H) && !/\((kg|%)\)/i.test(H), pct = /%/.test(H), frac = /^Persentase/i.test(H) && !/%/.test(H), anyDec = nums.some(n => Math.abs(n - Math.round(n)) > 1e-9);
  const dec = !plain && (pct || anyDec && X_WEIGHT.test(H)), mix = !plain && !dec && anyDec;
  const dates = strs.length > 0 && strs.every(s => DMY.test(s) || s === '-'), dt = dates && strs.some(s => !!DMY.exec(s)?.[4]);
  let w = 0;
  const isD = n => dec || mix && Math.abs(n - Math.round(n)) > 1e-9;
  for (const v of vals.slice(0, 2000)) { const L = typeof v === 'number' ? (plain ? String(v).length : xNumLen(v, isD(v)) + 1) : isSgn(v) ? xNumLen(v.n, isD(v.n)) + 2 : typeof v === 'string' ? (DMY.test(v) ? (DMY.exec(v)[4] ? 16 : 10.5) : v.length * 1.08) : 0; if (L > w) w = L; }
  const words = H.split(/\s+/).filter(Boolean), hw = Math.max(0, ...words.map(x => x.length * 1.12), H.length * 1.12 / 2);
  return { frac, fmt:n => plain ? XF.plain : frac ? XF.frac : pct ? XF.pct : isD(n) ? XF.dec : XF.int, sfmt:n => isD(n) ? XF.sDec : XF.sInt, dates, dt, center:X_CENTER.test(H) || dates, wrap:w > 46, width:Math.min(48, Math.max(7, Math.max(w, hw) + 3)) };
}
/* nilai sel + gaya sesuai jenis kolom (tanggal jadi tanggal asli Excel, angka pakai pemisah ribuan) */
function xVal(v, col, base){
  if (isSgn(v)) return [v, xs({ ...base, f:col.sfmt(v.n) })];
  if (typeof v === 'number' && isFinite(v)) return [v, xs({ ...base, f:col.fmt(v), h:col.center ? 'center' : base.h })];
  if (typeof v === 'string') { const m = DMY.exec(v); if (m) return [xSerial(m), xs({ ...base, f:m[4] ? XF.dt : XF.date, h:'center' })];
    const h = v === '-' || col.center ? 'center' : base.h; return [v, xs({ ...base, h, wrap:col.wrap || base.wrap, ...(h ? {} : { ind:1 }) })]; }
  return ['', xs(base)];
}
const xLines = (s, w) => Math.max(1, Math.ceil(String(s ?? '').length * 1.08 / Math.max(4, w - 1.5)));
const X_TOT = r => typeof r[0] === 'string' && /^(total|grand total|total tonase)$/i.test(r[0].trim());
const xPrinted = () => { const u = USERS[S.session?.user]?.nama, g = gudangById(S.session?.gudang); return `PT Santos Jaya Abadi Karawang  |  ${g && g.tipe !== 'dashboard' ? g.nama : 'Warehouse SJA 2'}  |  Dicetak ${D8(today())} ${hm(Date.now())}${u ? ' oleh ' + u : ''}`; };
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const tglPanjang = d => { const [y, m, dd] = d.split('-'); return `${+dd} ${BULAN[+m - 1]} ${y}`; };
/* baris total: angka yang sama dengan jumlah kolom ditulis sebagai rumus SUM supaya ikut berubah kalau data diedit */
function xTotal(B, r, row, cols, c0, r1, r2, base, body){
  const first = row.findIndex((v, i) => i > 0 && v !== '' && v != null);
  const span = first > 0 ? first - 1 : Math.max(0, row.length - 1);
  B.box(r, c0, r, c0 + span, row[0], xs({ ...base, h:base.h || 'left', ind:base.h ? 0 : 1 }));
  for (let c = span + 1; c < cols.length; c++) { let v = row[c]; const [, st] = xVal(v, cols[c], base), n = isSgn(v) ? v.n : v;
    if (typeof n === 'number' && !cols[c].frac && body.length && r2 >= r1) { const sum = body.reduce((a, x) => a + (isSgn(x[c]) ? x[c].n : typeof x[c] === 'number' ? x[c] : 0), 0); if (Math.abs(sum - n) < 0.01) v = { fx:`SUM(${colName(c0 + c)}${r1 + 1}:${colName(c0 + c)}${r2 + 1})`, n }; }
    B.set(r, c0 + c, v, st); }
}
function xSign(B, r, labels, n, c0 = 0){
  const W = B.w.slice(c0, c0 + n), tot = W.reduce((a, x) => a + x, 0), cut = [0];
  for (let i = 1; i < labels.length; i++) { let acc = 0, c = 0; while (c < n - 1 && acc + W[c] / 2 < tot * i / labels.length) acc += W[c++]; cut.push(Math.max(cut[i - 1] + 1, Math.min(c, n - (labels.length - i)))); }
  cut.push(n);
  B.ht[r] = 12; r++;
  const last = labels.length - 1;
  B.box(r, c0 + cut[last], r, c0 + n - 1, `Karawang, ${tglPanjang(today())}`, xs({ h:'center' })); r++;

  for (let k = 1; k <= 3; k++) B.ht[r + k] = 18;
  return r + 5;
}

/* ---------- Sheet tabel standar: judul, info dokumen, tabel berwarna, total, siap cetak ---------- */
function tableSheet(sh){
  const head = sh.head || [], all = (sh.rows || []).filter(r => r && r.some(v => v !== '' && v != null));
  const tots = all.filter(X_TOT), body = all.filter(r => !X_TOT(r)), n = Math.max(1, head.length, ...all.map(r => r.length));
  const cols = Array.from({ length:n }, (_, c) => xCol(head[c], body.map(r => r[c])));
  if (sh.form) return formSheet(sh, cols, body, tots, n);
  const B = XB(sh.name); B.w = cols.map(c => c.width);
  const pre = sh.pre || [], title = String(pre[0]?.[0] || sh.name || '').toUpperCase();
  B.set(0, 0, title, xs({ b:true, sz:15, c:XC.brand })); B.ht[0] = 27;
  for (let c = 0; c < n; c++) B.set(1, c, c ? '' : xPrinted(), xs({ sz:9, c:XC.muted, bd:'rule' })); B.ht[1] = 17;
  B.ht[2] = 9;
  let r = 3;
  /* info dokumen: pasangan label & isi, dua kolom kalau tabelnya cukup lebar */
  const pairs = pre.slice(1).map(x => [[x[0], x[1]], x.length > 3 ? [x[3], x[4]] : null]);
  const has = p => !!p && ((p[0] ?? '') !== '' || (p[1] ?? '') !== '');
  if (pairs.some(([L, R]) => has(L) || has(R))) {
    const tl = x => String(x ?? '').length * 1.1 + 3, tv = x => isSgn(x) ? 12 : typeof x === 'number' ? 14 : Math.min(30, String(x ?? '').length * 1.12 + 3);
    const need = side => pairs.map(p => p[side]).filter(has), mx = (a, f) => Math.max(0, ...a.map(f));
    const sw = (a, z) => B.w.slice(a, z + 1).reduce((x, y) => x + y, 0), mid = Math.ceil(n / 2), Ls = need(0), Rs = need(1);
    const two = n >= 4 && Rs.length > 0 && sw(0, mid - 1) >= mx(Ls, p => tl(p[0])) + mx(Ls, p => tv(p[1])) && sw(mid, n - 1) >= mx(Rs, p => tl(p[0])) + mx(Rs, p => tv(p[1]));
    const lab = (a, z, ps) => { const want = mx(ps, p => tl(p[0])); let k = 1, w = B.w[a]; while (a + k < z && w < want) w += B.w[a + k++]; return k; };
    const kL = lab(0, two ? mid - 1 : n - 1, two ? Ls : Ls.concat(Rs)), kR = two ? lab(mid, n - 1, Rs) : 0;
    const put = (p, a, z, lw) => { const vw = sw(a + lw, z), v = p[1];
      if (n === 1) { B.set(r, a, `${p[0]}: ${v ?? ''}`, xs({ bd:'all', wrap:true, ind:1 })); return xLines(`${p[0]}: ${v}`, B.w[a]); }
      B.box(r, a, r, a + lw - 1, p[0] ?? '', xs({ b:true, c:XC.label, bg:XC.lab, bd:'all', ind:1 }));
      const st = isSgn(v) ? xs({ b:true, bd:'all', h:'left', ind:1, f:Math.abs(v.n % 1) > 1e-9 ? XF.sDec : XF.sInt }) : typeof v === 'number' ? xs({ b:true, bd:'all', h:'left', ind:1, f:Math.abs(v % 1) > 1e-9 ? XF.dec : XF.int }) : xs({ b:true, bd:'all', wrap:true, ind:1 });
      B.box(r, a + lw, r, z, v ?? '', st);
      return typeof v === 'string' ? xLines(v, vw - 1) : 1; };
    const lines = two ? pairs.filter(([L, R]) => has(L) || has(R)) : pairs.flatMap(([L, R]) => [L, R]).filter(has).map(x => [x, null]);
    for (const [L, R] of lines) { let k = 1;
      if (has(L)) k = put(L, 0, two && has(R) ? mid - 1 : n - 1, kL);
      if (two && has(R)) k = Math.max(k, put(R, mid, n - 1, kR));
      B.ht[r] = Math.max(19, 13 * k + 6); r++; }
    B.ht[r] = 9; r++;
  }
  /* baris kelompok kolom (revisi 9 Nov, dipakai Data Keseluruhan) */
  const gr = sh.groups ? r : -1;
  if (sh.groups) { let c = 0; sh.groups.forEach(([g, k], i) => { B.box(r, c, r, c + k - 1, g, xs({ b:true, c:XC.white, bg:i % 2 ? XC.brand : XC.dark, bd:'head', h:'center' })); c += k; }); B.ht[r] = 21; r++; }
  /* kepala tabel */
  const hr = r, hl = Math.max(1, ...head.map((h, c) => xLines(h, B.w[c] - 0.5)));
  head.forEach((h, c) => B.set(hr, c, h, xs({ b:true, c:XC.white, bg:XC.brand, bd:'head', h:'center', wrap:true })));
  for (let c = head.length; c < n; c++) B.set(hr, c, '', xs({ bg:XC.brand, bd:'head' }));
  B.ht[hr] = Math.max(24, 13 * hl + 9); r++;
  const r1 = r;
  body.forEach(row => { let k = 1;
    for (let c = 0; c < n; c++) { const [v, st] = xVal(row[c], cols[c], { bd:'all' }); B.set(r, c, v, st); if (cols[c].wrap && typeof row[c] === 'string') k = Math.max(k, xLines(row[c], B.w[c])); }
    B.ht[r] = Math.max(18, 13 * k + 5); r++; });
  const r2 = r - 1;
  if (body.length >= 3) B.cf.push(`A${r1 + 1}:${colName(n - 1)}${r2 + 1}`);
  tots.forEach(row => { xTotal(B, r, row, cols, 0, r1, r2, { b:true, bg:XC.soft, bd:'tot' }, body); B.ht[r] = 21; r++; });
  if (!body.length && !tots.length) { B.box(r, 0, r, n - 1, 'Tidak ada data untuk ditampilkan.', xs({ i:true, c:XC.muted, h:'center', bd:'all' })); B.ht[r] = 26; r++; }
  (sh.notes || []).forEach((t, i) => { if (!i) { B.ht[r] = 8; r++; } B.set(r, 0, t, xs({ i:true, sz:9, c:XC.muted })); r++; });
  if (sh.sign) r = xSign(B, r, sh.sign, n);

  if (body.length >= 3 && !tots.length) B.filter = `A${hr + 1}:${colName(n - 1)}${r2 + 1}`;
  B.title = [gr >= 0 ? gr + 1 : hr + 1, hr + 1];

  B.land = B.w.reduce((a, x) => a + x, 0) > 92;
  return B.render();
}

/* ---------- Form resmi (contoh F/WH/14, FI/PPC/07): kop form, kepala bertingkat, warna baris ---------- */
function formSheet(sh, cols, body, tots, n){
  const F = sh.form, B = XB(sh.name), c0 = 1, L = c0 + n - 1, sz = F.sz || 11, bk = { sz, bd:'blk' };
  B.w = [2.5, ...cols.map((c, i) => Math.max(c.width * (sz / 10), (F.minW || {})[i] || 0, 9))];
  (F.groups || []).forEach(g => g[3].forEach((t, j) => { const i = c0 + g[0] + j; B.w[i] = Math.max(B.w[i], String(t).length * 1.15 * (sz / 10) + 3, 12); }));
  if (B.w[L] < 30) B.w[L] = 30;
  B.ht[0] = 8;
  /* kop: perusahaan | judul | info dokumen */
  const right = F.right || [], hRows = Math.max(2, right.length, F.title ? 3 : 2);
  let kc = 1, w = B.w[c0]; while (c0 + kc < L - 1 && w < 26) w += B.w[c0 + kc++];
  const topEnd = F.title ? 2 : hRows;
  B.box(1, c0, topEnd, c0 + kc - 1, F.company || 'PT Santos Jaya Abadi\nKarawang', xs({ b:true, sz:12, h:'center', wrap:true, bd:'blk' }));
  B.box(1, c0 + kc, topEnd, L - 1, F.top || 'FORM', xs({ b:true, sz:16, h:'center', wrap:true, bd:'blk' }));
  if (F.title) B.box(3, c0, hRows, L - 1, F.title, xs({ b:true, sz:F.titleSz || 14, h:'center', wrap:true, bd:'blk' }));
  for (let i = 0; i < hRows; i++) { B.set(1 + i, L, right[i] || '', xs({ sz, bd:'blk', ind:1 })); B.ht[1 + i] = 21; }
  let r = hRows + 1; B.ht[r] = 6; r++;
  /* baris periode / area */
  (F.bars || []).forEach(bar => { const mid = c0 + Math.ceil(n / 2) - 1;
    B.box(r, c0, r, bar.length > 1 ? mid : L, bar[0], xs({ b:true, sz:12, bg:F.barBg || XC.green, bd:'blk', ind:1 }));
    if (bar.length > 1) B.box(r, mid + 1, r, L, bar[1], xs({ b:true, sz:12, bg:F.barBg || XC.green, bd:'blk', ind:1 }));
    B.ht[r] = 23; r++; });
  B.ht[r] = 6; r++;
  /* kepala tabel (bisa bertingkat) */
  const hs = xs({ b:true, sz, bg:F.headBg || XC.yellow, bd:'blk', h:'center', wrap:true }), G = F.groups || [], h0 = r, two = G.length > 0;
  const inG = c => G.find(g => c >= g[0] && c <= g[1]);
  for (let c = 0; c < n; c++) { const g = inG(c);
    if (!two) B.set(r, c0 + c, sh.head[c] ?? '', hs);
    else if (!g) B.box(r, c0 + c, r + 1, c0 + c, sh.head[c] ?? '', hs);
    else { if (c === g[0]) B.box(r, c0 + g[0], r, c0 + g[1], g[2], hs); B.set(r + 1, c0 + c, g[3][c - g[0]] ?? sh.head[c], hs); } }
  const hl = Math.max(1, ...sh.head.map((h, c) => inG(c) ? 1 : xLines(h, B.w[c0 + c] / (sz / 10))));
  if (two) { B.ht[r] = 23; B.ht[r + 1] = Math.max(23, 13 * hl); r += 2; } else { B.ht[r] = Math.max(26, 14 * hl + 8); r++; }
  const hz = r - 1, r1 = r;
  body.forEach(row => { const bg = F.rowBg ? F.rowBg(row) : null, base = { ...bk, h:'center', ...(bg ? { bg } : {}) }; let k = 1;
    for (let c = 0; c < n; c++) { const col = { ...cols[c], center:true, wrap:cols[c].wrap || cols[c].width > 34 }, [v, st] = xVal(row[c], col, { ...base, wrap:col.wrap }); B.set(r, c0 + c, v, st); if (col.wrap && typeof row[c] === 'string') k = Math.max(k, xLines(row[c], B.w[c0 + c] / (sz / 10))); }
    B.ht[r] = Math.max(22, 15 * k + 6); r++; });
  const r2 = r - 1;
  const totRows = tots.length ? tots : F.sum && body.length ? [[F.sumLabel || 'TOTAL', ...Array.from({ length:n - 1 }, (_, i) => F.sum.includes(i + 1) ? Math.round(body.reduce((a, x) => a + (typeof x[i + 1] === 'number' ? x[i + 1] : 0), 0) * 100) / 100 : '')]] : [];
  totRows.forEach(row => { xTotal(B, r, row, cols.map(c => ({ ...c, center:true })), c0, r1, r2, { b:true, sz, bd:'blk', h:'center' }, body); B.ht[r] = 23; r++; });
  if (!body.length && !totRows.length) { B.box(r, c0, r, L, 'Tidak ada data untuk ditampilkan.', xs({ i:true, sz, c:XC.muted, h:'center', bd:'blk' })); B.ht[r] = 26; r++; }
  if (sh.sign) r = xSign(B, r, sh.sign, n, c0);

  B.land = true;
  return B.render();

/* kotak kondisi gudang + kolom tanda tangan: sig = [[label, kolom awal, kolom akhir], ...] */
function opBawah(B, r, kc, kondisi, sig){

const r1x = v => Math.round(v * 10) / 10;

function sideNav(g){

    return kopiNav().map(it => { const on = it.p === 'home' ? page === 'home' : chain.includes(it.p);
      return `<button class="snav-i${on ? ' on' : ''}" data-act="go" data-page="${it.p}"${it.p === page ? ' aria-current="page"' : ''}>${ic(it.i, 19)}<span>${esc(it.t)}</span>${it.sub ? `<i class="snav-chev${on ? ' open' : ''}">${ic('chev', 14)}</i>` : ''}</button>` +

  }
  if (g.tipe === 'dashboard') { const v = dviews().some(d => d[0] === S.ui.dview) ? S.ui.dview : 'dash';

function groupBy(list, keyFn, valFn){ const m = new Map(); for (const x of list) { const k = keyFn(x); const e = m.get(k) || { v:0, z:0 }; e.v += valFn(x); e.z += x.p.karung || 0; m.set(k, e); } return [...m.entries()].sort((a, b) => b[1].v - a[1].v); }
/* Inbound vs Outbound (kg) per hari / minggu dalam periode */
function inOutSeries(tx){

  const days = Math.round((d1 - d0) / 864e5) + 1, weekly = days > 45, keys = [], idx = {};
  for (let i = 0; i < days; i++) { const d = new Date(d0); d.setDate(d.getDate() + i); const k = ymd(d), key = weekly ? keys.length && i % 7 ? keys[keys.length - 1] : k : k; if (!idx[key]) { idx[key] = { key, inn:0, out:0 }; keys.push(key); } idx[k] = idx[key]; }
  for (const x of tx) { const e = idx[tsDay(x.t)]; if (!e) continue; if (x.out) e.out += nettoKeluar(x.p); else if (x.status === 'Inbound') e.inn += netto(x.p); }
  return { weekly, rows:keys.map(k => idx[k]) };
}
function inOutChart(ser){

  if (!n) return '<p class="empty">Tidak ada data pada periode ini.</p>';
  const W = 760, H = 260, L = 64, R = 14, T = 16, B = 34, w = W - L - R, h = H - T - B;
  const max = Math.max(1, ...rows.map(r => Math.max(r.inn, r.out))), mag = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / mag) * mag;
  const x = i => L + (n === 1 ? w / 2 : i * w / (n - 1)), y = v => T + h - v / top * h, short = v => v >= 1e6 ? num(Math.round(v / 1e5) / 10) + ' jt' : v >= 1e3 ? num(Math.round(v / 100) / 10) + ' rb' : num(v);

  const every = Math.max(1, Math.ceil(n / 10));
  rows.forEach((r, i) => { if (i % every === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(ser.weekly ? 'mg ' + fdate(r.key).replace(/ \d{4}$/, '') : String(Number(r.key.slice(8))))}</text>`; });
  const area = (k, c) => `<path d="M${x(0)},${y(0)} ${rows.map((r, i) => `L${x(i)},${y(r[k])}`).join(' ')} L${x(n - 1)},${y(0)} Z" fill="${c}" opacity=".08"/>`;
  const line = (k, c, dash) => `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"${dash ? ' stroke-dasharray="6 4"' : ''} points="${rows.map((r, i) => `${x(i)},${y(r[k])}`).join(' ')}"/>`;
  const dots = rows.map((r, i) => `<g class="io-pt"><rect x="${x(i) - Math.max(6, w / n / 2)}" y="${T}" width="${Math.max(12, w / n)}" height="${h}" fill="transparent"/><circle cx="${x(i)}" cy="${y(r.inn)}" r="3.5" fill="${ci}"/><circle cx="${x(i)}" cy="${y(r.out)}" r="3.5" fill="${co}"/><title>${esc((ser.weekly ? 'Minggu mulai ' : '') + fdate(r.key))}: inbound ${num(r.inn)} kg, outbound ${num(r.out)} kg (${r.inn >= r.out ? 'inbound lebih tinggi ' + num(r.inn - r.out) : 'outbound lebih tinggi ' + num(r.out - r.inn)} kg)</title></g>`).join('');

  <div class="legend" style="justify-content:center;margin-top:4px"><span><i class="sw" style="background:${ci}"></i>Inbound (kg)</span><span><i class="sw" style="background:${co}"></i>Outbound (kg, garis putus-putus)</span><span>Arahkan kursor / sentuh titik untuk angka per ${ser.weekly ? 'minggu' : 'hari'}.</span></div>`;
}

/* =========================================================
   LAPORAN SELISIH PER KODE (revisi 15 Okt, permintaan Sheli)
   Mengikuti file "REKAPITULASI DATA SUSUT MONTHLY 2026": satu baris per Nomor Lot,
   Inbound (kg) = total netto timbang masuk lot itu, Outbound (kg) = total netto timbang keluar.
   Lot baru masuk laporan setelah habis (semua palletnya sudah keluar);
   Tanggal Outbound (di file: Tanggal Dok. BA) = tanggal pallet terakhir lot itu keluar.
   SW di silo tidak per lot (isi silo bercampur), jadi yang dihitung hanya SW yang disimpan di gudang (pallet).

const skGrp = k => String(k).startsWith('GODOK') ? 'GODOK' : isSWKode(k) ? 'SW' : String(k).split(' ')[0];

const skKodes = () => { const order = ['06', '07', '09', '10', 'GODOK', 'SW'], ada = jenisPrefix(); return [...order.filter(k => ada.includes(k)), ...ada.filter(k => !order.includes(k))]; };
const pct1 = v => typeof v === 'number' && isFinite(v) ? (v * 100).toLocaleString('id-ID', { maximumFractionDigits:1 }) + '%' : '-';
const pct3 = v => typeof v === 'number' && isFinite(v) ? (v * 100).toLocaleString('id-ID', { minimumFractionDigits:3, maximumFractionDigits:3 }) + '%' : '-';
function susutLots(){
  return memo('susutLots', () => {
    const m = new Map();
    for (const p of S.pallets) { const b = bOf(p); if (!b.id) continue; const lot = b.noLot || '(tanpa lot)', k = lot + '|' + b.kode;
      let e = m.get(k); if (!e) { e = { lot, kode:b.kode, ps:[] }; m.set(k, e); } e.ps.push(p); }
    const out = [];
    for (const e of m.values()) {
      if (!e.ps.length || !e.ps.every(p => p.status === 'keluar' && p.keluar)) continue;
      const inn = Math.round(e.ps.reduce((a, p) => a + netto(p), 0) * 100) / 100, kel = Math.round(e.ps.reduce((a, p) => a + nettoKeluar(p), 0) * 100) / 100;
      const t = Math.max(...e.ps.map(p => p.keluar.waktu)), d = Math.round((inn - kel) * 100) / 100;
      out.push({ lot:e.lot, kode:e.kode, grp:skGrp(e.kode), jenis:skJenis(e.kode), n:e.ps.length, tgl:tsDay(t), inn, out:kel, susut:d > 0 ? d : 0, surplus:d < 0 ? -d : 0, sw:isSWKode(e.kode) });

}

const skRows = g => { const [a, b] = skRange(); return susutLots().filter(x => inRange(x.tgl, a, b) && (!g || x.grp === g)); };
const skTot = L => { const s = k => Math.round(L.reduce((a, x) => a + x[k], 0) * 100) / 100; const t = { n:L.length, inn:s('inn'), out:s('out'), susut:s('susut'), surplus:s('surplus') }; t.net = t.inn ? (t.inn - t.out) / t.inn : null; return t; };
const skKet = x => x.sw ? 'Stock Gudang' : '';
function skPresets(){ const t = today(), d = new Date(), m0 = new Date(d.getFullYear(), d.getMonth() - 1, 1), m1 = new Date(d.getFullYear(), d.getMonth(), 0);
  return [['Bulan ini', monthStart(), t], ['Bulan lalu', ymd(m0), ymd(m1)], ['Tahun ini', t.slice(0, 4) + '-01-01', t]]; }
function pSusutKode(){

    <li>Inbound = total netto timbang masuk lot, Outbound = total netto timbang keluar lot. Selisih susut kalau inbound lebih besar, surplus kalau outbound lebih besar.</li>
    <li>${semua ? 'Persentase susut = susut ÷ inbound, persentase surplus = surplus ÷ outbound (sama dengan sheet Rekap Susut Kopi).' : 'Persentase = selisih ÷ inbound (sama dengan sheet % Kopi / % Godok / % SW).'} SW yang masuk silo tidak dihitung per lot karena isi silo bercampur; yang dihitung hanya SW yang disimpan di gudang.</li></ul>`;
}
/* sheet ekspor: per kode seperti "% Kopi 07", semua seperti "Rekap Susut Kopi" */

  const tbl = R.length ? `<div class="tbl" style="max-height:520px"><table class="nowrap"><thead><tr><th>Baris</th><th>Status</th><th class="l">Kesalahan</th><th>Lokasi</th><th>No Pallet</th><th>Kode</th><th>Supplier</th><th>Kedatangan</th><th>Bongkar</th><th>Karung</th><th>Netto (kg)</th><th>Status QA</th></tr></thead><tbody>
    ${R.slice().sort((a, b) => (b.err.length ? 1 : 0) - (a.err.length ? 1 : 0) || a.baris - b.baris).slice(0, 500).map(x => `<tr${x.err.length ? ' class="imp-bad"' : ''}><td>${x.baris}</td><td>${x.err.length ? '<span class="badge b-warn">Salah</span>' : '<span class="badge b-ok">OK</span>'}</td><td class="l imp-err">${x.err.length ? `<span class="neg">${esc(x.err.join('; '))}</span>` : '<span class="muted">-</span>'}</td><td>${x.lokasi ? `<b>${esc(x.brs ? slotCode(x.lokasi, x.brs, x.tum) : locName(x.lokasi))}</b>${x.auto ? '<br><small class="muted">posisi otomatis</small>' : ''}` : '-'}</td><td>${esc(x.noPallet || '-')}</td><td>${esc(x.kode || '-')}</td><td class="wrap">${esc(x.supplier || '-')}</td><td>${isYmd(x.tanggal) ? esc(fdate(x.tanggal)) : '-'}</td><td>${isYmd(x.tanggalBongkar) ? esc(fdate(x.tanggalBongkar)) : '-'}</td><td>${Number.isInteger(x.karung) ? num(x.karung) : '-'}</td><td>${x.netto > 0 ? num(x.netto) : '-'}</td><td>${esc(x.statusQA || '-')}${x.kadarAir != null && x.kadarAir > 0 ? ` · ${num(x.kadarAir)}%` : ''}</td></tr>`).join('')}
    </tbody></table></div>${R.length > 500 ? `<p class="hint">Menampilkan 500 dari ${num(R.length)} baris.</p>` : ''}` : '';
  return banner('Import Stok Awal') + lock('master') + `
  <div class="card"><h3>1. Siapkan file stok</h3><p class="hint">Isi template Excel: satu baris = satu pallet yang sekarang ada di gudang. Kolom wajib: Lokasi, No Pallet, Kode Bahan, Tanggal Kedatangan, Karung, dan Berat Netto (atau Berat Bruto + Berat Pallet).</p>
    <div class="row mt">${xBtn('tplStok', 'Unduh template Excel')}</div></div>
  <div class="card mt"><h3>2. Pilih file dan periksa</h3>
    <div class="row"><label class="btn${c ? '' : ' disabled'}" style="cursor:pointer">${ic('file', 16)}<span>Pilih file Excel (.xlsx) atau CSV</span><input type="file" accept=".xlsx,.csv,text/csv" data-change="impFile" hidden${c ? '' : ' disabled'}></label>${IMP ? `<span class="hint">${esc(IMP.name)} · sheet ${esc(IMP.sheet)}</span>` : ''}</div>
    ${IMP && IMP.loading ? '<p class="hint mt">Membaca file…</p>' : ''}${IMP && IMP.error ? `<p class="err mt">${esc(IMP.error)}</p>` : ''}
    ${R.length ? `<div class="sum mt"><div>Baris dibaca<b>${num(R.length)}</b></div><div>Siap diimport<b class="pos">${num(nOk)} pallet</b></div><div>Ada kesalahan<b class="${nErr ? 'neg' : ''}">${num(nErr)} baris</b></div><div>Total netto siap<b>${num(Math.round(R.filter(x => !x.err.length).reduce((s, x) => s + x.netto, 0)))} kg</b></div></div>` : ''}
    ${tbl}
    ${R.length ? `<div class="row mt" style="justify-content:flex-end"><button class="btn ghost" data-act="impBatal">Batal</button><button class="btn blue" data-act="impGo"${c && nOk ? '' : ' disabled'}>Import ${num(nOk)} pallet${nErr ? ' yang benar' : ''}</button></div>` : ''}</div>
  <ul class="notes mt"><li>Pallet dengan tanggal kedatangan, kode, supplier, no lot, dan no kendaraan yang sama digabung menjadi satu kedatangan "Stok awal". Kalau no kendaraan kosong, tertulis STOK AWAL.</li>
    <li>Lokasi boleh kode lengkap (LA.01.02.03), kolom saja (LA.01, sistem memilih posisi kosong paling dalam), atau area tambahan (Line U, RA.01, Transit).</li>
    <li>Status QA kosong dianggap Diterima. Baris yang salah tidak ikut diimport; perbaiki di file lalu import lagi. No pallet yang sudah ada di gudang otomatis ditolak, jadi import ulang tidak membuat data dobel.</li></ul>`;
}
function impTemplate(){
  const m = S.master.filter(x => !isSWKode(x.kode))[0] || S.master[0] || { kode:'09 AM', supplier:'' }, t = D8(today());
  return [
    { name:'Stok', pre:[['TEMPLATE IMPORT STOK AWAL GBB KOPI'], ['Satu baris = satu pallet. Hapus 2 baris contoh sebelum import.']], head:IMP_COLS.map(c => c[1]),
      rows:[['LA.01.01.01', '1001', m.kode, m.supplier, t, t, '', 'BE 1234 AB', 28, 2350, 110, 2240, 'Diterima', 12.1], ['LA.01', '1002', m.kode, m.supplier, t, t, '', 'BE 1234 AB', 28, '', '', 2235, '', '']] },
    { name:'Petunjuk', head:['Kolom', 'Wajib', 'Keterangan'], rows:[
      ['Lokasi', 'Ya', 'Kode lengkap LINE.KOLOM.BARIS.TUMPUK (contoh LA.01.02.03), atau kolom saja (LA.01) supaya sistem memilih posisi kosong paling dalam, atau area tambahan: Line U, RA.01 sampai RE.02, Transit.'],
      ['No Pallet', 'Ya', 'Huruf, angka, atau strip. Tidak boleh dobel dan tidak boleh sama dengan pallet yang sudah ada di gudang.'],
      ['Kode Bahan', 'Ya', 'Harus ada di Master Data (lihat sheet Daftar Kode).'],
      ['Supplier', 'Kalau kode punya lebih dari satu supplier, dan selalu untuk SW', 'Nama persis seperti di Master Data. Khusus SW: ketik nama supplier sesuai surat jalan (tidak dari Master Data).'],
      ['Tanggal Kedatangan', 'Ya', 'Format dd/mm/yyyy atau tanggal Excel.'],
      ['Tanggal Bongkar', 'Tidak', 'Kosong = sama dengan tanggal kedatangan. Dipakai untuk urutan FIFO dan nomor lot.'],
      ['No Lot', 'Tidak', 'Kosong = dibuat otomatis dari kode supplier dan tanggal bongkar.'],
      ['No Kendaraan', 'Tidak', 'Kosong = STOK AWAL.'],
      ['Karung', 'Ya', 'Bilangan bulat. Untuk SW isi jumlah big bag (1 pallet = 2 big bag), kosong = 2.'],
      ['Berat Bruto / Berat Pallet / Berat Netto (kg)', 'Netto, atau Bruto + Pallet', 'Kalau hanya netto, berat pallet dianggap 0 (bisa diisi saat timbang keluar).'],
      ['Status QA', 'Tidak', 'Diterima / Ditahan / Ditolak. Kosong = Diterima.'],
      ['Kadar Air (%)', 'Tidak', 'Hasil inspeksi QA kalau ada.']] },
    { name:'Daftar Kode', head:['Kode Bahan', 'Supplier', 'Nama Barang'], rows:S.master.map(x => [x.kode, x.supplier, x.namaBarang || namaBahanOf(x.kode)]) },
    { name:'Daftar Lokasi', head:['Lokasi', 'Jenis', 'Kapasitas (pallet)', 'Terisi sekarang'], rows:[...LINE_IDS.map(l => [l, 'Kolom line', capOf(l), lineCount(l)]), ...EXTRA_LOC.filter(x => x.id !== 'TRANSIT').map(x => [x.nama, x.lorong ? 'Lorong tepi' : 'Area tambahan', isFinite(capOf(x.id)) ? capOf(x.id) : '', lineCount(x.id)]), ['Transit', 'Persiapan outbound', '', lineCount('TRANSIT')]] }
  ];
}
Object.assign(ACT, {
  impBatal:() => { IMP = null; render(); },
  impGo:() => {
    if (!can('master') || !IMP || !IMP.rows) return;
    const fresh = impCheck(IMP.raw); IMP.rows = fresh.rows;   /* cek ulang dengan data terbaru (bisa saja ada pallet baru dari pengguna lain) */
    const n = IMP.rows.filter(x => !x.err.length).length; if (!n) { render(); return toast('Tidak ada baris yang siap diimport.', true); }
    ask(`Import ${n} pallet ke gudang sebagai stok awal? Pallet langsung berstatus Simpan di posisinya.`, 'Import', () => {
      const r = impApply(IMP.rows); IMP = null; commit(`${r.nP} pallet stok awal tersimpan (${r.nB} kelompok kedatangan)`);
    });
  }
});
Object.assign(CHANGE, {
  impFile:async el => {
    const f = el.files && el.files[0]; el.value = ''; if (!f) return;
    IMP = { name:f.name, loading:true }; render();
    try {
      if (f.size > 15 * 1024 * 1024) throw new Error('File terlalu besar (maksimal 15 MB).');
      const raw = /\.csv$/i.test(f.name) ? impReadCsv(await f.text()) : await impReadXlsx(await f.arrayBuffer());
      /* pakai sheet pertama yang punya judul kolom No Pallet + Kode Bahan (sheet bernama "Stok..." dicoba duluan) */
      let c = null, err0 = null; for (const r of [].concat(raw)) { try { c = impCheck(r); break; } catch (x) { err0 = err0 || x; } }
      if (!c) throw err0; IMP = { name:f.name, sheet:c.sheet, raw:[].concat(raw).find(r => r.sheet === c.sheet) || raw, rows:c.rows };
      if (!c.rows.length) IMP.error = 'Tidak ada baris data di bawah judul kolom.';
    } catch (e) { IMP = { name:f.name, error:(e && e.message) || 'File tidak bisa dibaca.' }; }
    render();
  }
});
EXPORTS.tplStok = { file:() => 'Template-Import-Stok-GBB-Kopi', sheets:impTemplate };

PAGES.importStok = { t:'Import Stok Awal', p:'data' };
PAGEFN.importStok = pImportStok;
PAGE_PERM.importStok = ['master'];
TILE_IC.importStok = 'file';
TILE_SUB.dataAll = 'Semua data per lot & pallet, lengkap dengan PIC';
TILE_SUB.importStok = 'Pallet yang sudah ada di gudang, dari file Excel';

/* =========================================================
   revisi 10 Nov: CELAH SISTEM & KENYAMANAN TABLET
   - tombol Back browser / tablet = kembali satu langkah di dalam aplikasi (tutup pop up, tutup form, naik satu menu), tidak keluar dari aplikasi
   - dua tab / jendela di perangkat yang sama tidak saling menimpa data
   - peringatan sebelum halaman ditutup / dimuat ulang kalau ada isian form yang belum disimpan
   - pembatasan percobaan login, tombol kembali ke atas, bantuan geser tabel
   ========================================================= */
let DIRTY = false, NET_OFF = false;
/* ---- login: 5 kali salah = kunci 30 detik ---- */
const LOGIN_LS = 'wms-sja2-loginfail';
function loginSt(){ try { const x = JSON.parse(localStorage.getItem(LOGIN_LS) || 'null'); if (x && typeof x === 'object') return x; } catch (e) {} return { n:0, until:0 }; }
function loginLock(){ const x = loginSt(); return x.until > Date.now() ? Math.ceil((x.until - Date.now()) / 1000) : 0; }
function loginFail(){ const x = loginSt(); if (x.until && x.until <= Date.now()) { x.n = 0; x.until = 0; } x.n = (x.n || 0) + 1; if (x.n >= 5) { x.until = Date.now() + 30e3; x.n = 0; } try { localStorage.setItem(LOGIN_LS, JSON.stringify(x)); } catch (e) {} return x.until > Date.now() ? 0 : 5 - x.n; }
function loginReset(){ try { localStorage.removeItem(LOGIN_LS); } catch (e) {} }
/* ---- tombol Back ---- */
function histDepth(){
  const ss = S && S.session; if (!ss || SPL_MODE) return 0;
  const md = document.getElementById('modal');
  if ((md && !md.hidden) || document.querySelector('form.pf-open') || document.querySelector('.mshell.nav-open')) return 2;
  if (ss.gudang && !(ss.unlocked && ss.unlocked[ss.gudang])) return 1;
  if (ss.gudang === 'kopi' && ss.page && ss.page !== 'home' && !isBintang()) return 1;
  return 0;
}
function histArm(){ try { if (histDepth() > 0 && !(history.state && history.state.wms)) history.pushState({ wms:1 }, ''); } catch (e) {} }
window.addEventListener('popstate', () => { guard(() => {
  const ss = S && S.session; if (!ss || SPL_MODE) return;
  const md = document.getElementById('modal');
  if (md && !md.hidden) { AKV = null; closeModal(); }
  else if (document.querySelector('form.pf-open')) pfClose();
  else if (document.querySelector('.mshell.nav-open')) ACT.navClose();
  else if (ss.gudang && !(ss.unlocked && ss.unlocked[ss.gudang])) ACT.gantiGudang();
  else if (ss.gudang === 'kopi' && ss.page && ss.page !== 'home' && !isBintang()) go(PAGES[ss.page].p || 'home');
  histArm();
}); });
/* ---- isian belum disimpan ---- */
window.addEventListener('beforeunload', e => { if (DIRTY && document.querySelector('form.pf-open, #modal:not([hidden]) form')) { e.preventDefault(); e.returnValue = ''; } });
/* ---- dua tab di perangkat yang sama: ambil data terbaru dari tab lain, akun & posisi layar tab ini tetap ---- */
let SYNC_T = 0;
window.addEventListener('storage', e => {
  if (ONLINE || e.key !== KEY || !e.newValue || !S) return;
  let d; try { d = JSON.parse(e.newValue); } catch (err) { return; }
  if (!valid(d) || d.v !== VERSION) return;
  const sess = S.session, ui = S.ui;
  ['cc', 'ccAdj', 'ba', 'spl'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  S = d; S.session = sess; S.ui = ui && typeof ui === 'object' ? ui : {}; REV++;
  guard(() => render());
  if (sess && Date.now() - SYNC_T > 20e3) { SYNC_T = Date.now(); toast('Data diperbarui dari tab / jendela lain di perangkat ini.'); }
});
/* ---- koneksi (versi online) ---- */
window.addEventListener('offline', () => { if (!ONLINE) return; NET_OFF = true; saveWarn(); });
window.addEventListener('online', () => { if (!NET_OFF) return; NET_OFF = false; saveWarn(); toast('Koneksi internet kembali.'); });
/* ---- tabel: kolom Aksi di kanan tetap terlihat + bayangan tepi kalau masih bisa digeser ---- */
function tblEdge(t){ const max = t.scrollWidth - t.clientWidth; t.classList.toggle('sx-r', max > 4 && t.scrollLeft < max - 4); t.classList.toggle('sx-l', max > 4 && t.scrollLeft > 4); }
function tblEnhance(){
  document.querySelectorAll('.tbl').forEach(t => {
    t.querySelectorAll('table').forEach(tb => { const hr = tb.tHead && tb.tHead.rows[0], th = hr && hr.cells[hr.cells.length - 1]; tb.classList.toggle('act-r', !!(th && hr.cells.length > 2 && /^aksi$/i.test(th.textContent.trim()))); });
    tblEdge(t);
  });
}
document.addEventListener('scroll', e => { const t = e.target; if (t && t.classList && t.classList.contains('tbl')) tblEdge(t); }, { passive:true, capture:true });
window.addEventListener('resize', () => { document.querySelectorAll('.tbl').forEach(tblEdge); }, { passive:true });
/* ---- bantuan peta dibuka / ditutup: diingat ---- */
document.addEventListener('toggle', e => { const d = e.target; if (d && d.classList && d.classList.contains('dn-help') && S && S.ui) { S.ui.dnHelp = d.open ? 1 : 0; if (!ONLINE) save0(S); } }, true);
/* ---- tombol kembali ke atas ---- */
(() => {
  const b = document.createElement('button'); b.type = 'button'; b.id = 'totop'; b.className = 'totop'; b.setAttribute('aria-label', 'Kembali ke atas'); b.title = 'Kembali ke atas'; b.textContent = '↑';
  b.addEventListener('click', () => { const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; window.scrollTo({ top:0, behavior:still ? 'auto' : 'smooth' }); });
  document.body.appendChild(b);
  window.addEventListener('scroll', () => { b.classList.toggle('on', window.scrollY > 700); }, { passive:true });
})();

/* =========================================================
   MULAI
   ========================================================= */
applyTheme(getTheme());
applyUi(getUi());
window.addEventListener('scroll', () => { const tb = document.querySelector('.tb'); if (tb) tb.classList.toggle('scrolled', window.scrollY > 4); }, { passive:true });
document.addEventListener('scroll', e => { const t = e.target; if (t && t.classList && t.classList.contains('dn-scroll')) DN_X = t.scrollLeft; }, { passive:true, capture:true });
if (ONLINE) onlineBoot(); else { akunLoad(); load(); render(); }
(async () => {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      DL = await window.claude.use('downloads');
      if (DL) render();
    }
  } catch (e) { DL = null; }
})();
</script>
</body>
</html>
